integracion_documento_calidad.finalizarDocumentoCalidadDrive:
  path: '/node/{node}/finalizarDocumentoCalidadDrive'
  defaults:
    _controller: '\Drupal\integracion_documento_calidad\Controller\IntegracionDocumentoCalidadController::finalizarDocumentoCalidadDrive'
  requirements:
    _permission: 'documento calidad'
  options:
    parameters:
      node:
        type: 'entity:node'
        bundle:
          - 'documentos_calidad'

